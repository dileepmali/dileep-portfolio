<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Dileep Kumar — Frontend Developer</title>
    <meta
      name="description"
      content="Dileep Kumar — frontend developer building Android, iOS and mobile web applications at AnantKaya Solutions. Selected work: AnantSpace and Aukra."
    />
    <meta name="theme-color" content="#dfdece" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph (LinkedIn / WhatsApp / Facebook previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dileep Kumar — Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend developer — Android, iOS and mobile web."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Dileep Kumar — Frontend Developer" />
    <meta
      name="twitter:description"
      content="Frontend developer — Android, iOS and mobile web."
    />

    <!-- Fonts: preconnect + load here (faster than a CSS @import)
         Switzer  — neo-grotesk display/body (the PP Neue Montreal register)
         IBM Plex Mono — small caps labels, meta and numerals -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <!-- Clash Display carries the headlines: far more character than a neutral
         grotesk, which is what makes the type read as the loudest element -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
       * Runs before first paint, which is the only place these two things work.
       *
       * 1. `data-motion="pending"` hides the elements that are about to animate
       *    in. The motion engine has to wait for document.fonts.ready before it
       *    can measure text for splitting, and without this the hero would
       *    paint fully assembled and then jump back to animate.
       *
       * 2. The hero's Flip is measured from a known scroll position. A browser
       *    restoring the previous scroll offset on reload would measure the two
       *    boxes against a viewport that has already moved, so restoration is
       *    turned off and the page is pinned to the top.
       *
       * Both are skipped for reduced motion, where nothing animates anyway.
       */
      (function () {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

        var html = document.documentElement;
        html.setAttribute("data-motion", "pending");
        // Gates the opening title card. Set here rather than in CSS so that a
        // visitor whose bundle never loads simply never sees the overlay,
        // instead of being stuck behind one nothing can dismiss.
        html.setAttribute("data-preload", "");

        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        addEventListener("load", function () {
          scrollTo(0, 0);
        });

        // Failsafe. If the bundle never executes — blocked script, network
        // failure, a JS error before the engine mounts — the guard would leave
        // the hero permanently invisible. Content always wins over choreography.
        setTimeout(function () {
          html.removeAttribute("data-motion");
          html.removeAttribute("data-preload");
        }, 6000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
