<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>SELFOWN — Personal Portfolio & Freelance Web Developer</title>
    <meta
      name="description"
      content="SELFOWN — portfolio of a freelance web developer, UI/UX designer and app developer. Browse projects, services, resume and get in touch for your next project."
    />
    <meta name="theme-color" content="#1bb6c1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph (LinkedIn / WhatsApp / Facebook previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SELFOWN — Personal Portfolio" />
    <meta
      property="og:description"
      content="Freelance web developer, UI/UX designer and app developer. Browse projects, services and get in touch."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SELFOWN — Personal Portfolio" />
    <meta
      name="twitter:description"
      content="Freelance web developer, UI/UX designer and app developer."
    />

    <!-- Fonts: preconnect + load here (faster than a CSS @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
